name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust format, lint, and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  helper-contract:
    name: APT helper startup-contract harness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S helper/apt-helper -B build/apt-helper -DBUILD_TESTING=ON
      - run: cmake --build build/apt-helper --parallel
      - run: ctest --test-dir build/apt-helper --output-on-failure

  node:
    name: TypeScript workspace checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - run: node --test service/migrations/test/*.test.mjs

  postgres-tenant-isolation:
    name: PostgreSQL tenant-isolation migration gate
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rootpermit_ci
          POSTGRES_USER: rootpermit_ci_owner
          POSTGRES_PASSWORD: rootpermit_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rootpermit_ci_owner -d rootpermit_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: rootpermit_ci
      PGUSER: rootpermit_ci_owner
      PGPASSWORD: rootpermit_ci_password
    steps:
      - uses: actions/checkout@v4
      - name: Install the PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client
      - name: Apply hosted schema migrations
        run: |
          for migration in service/migrations/[0-9]*.sql; do
            psql --no-psqlrc --set ON_ERROR_STOP=1 --file "$migration"
          done
      - name: Prove live tenant RLS and transaction context reset
        run: |
          psql --no-psqlrc --set ON_ERROR_STOP=1 \
            --file service/migrations/test/live-tenant-isolation.sql

  fixture-contract:
    name: Fixture contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Assert only declared contract manifests exist in M0
        run: |
          test "$(find fixtures -name manifest.json -type f | wc -l)" -eq 2
          grep -R '"status": "contract-only"' fixtures/*/manifest.json
