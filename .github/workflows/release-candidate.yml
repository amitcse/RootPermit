name: Release candidate evidence

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-candidate-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enforce release-candidate lane selection
        run: |
          ROOTPERMIT_RELEASE_CANDIDATE=1 node ci/lane-selection.mjs \
            Cargo.toml package.json helper/apt-helper/CMakeLists.txt fixtures/ubuntu-amd64/manifest.json \
            | tee release-lanes.json
          grep -F '"release":true' release-lanes.json
          grep -F '"privileged":true' release-lanes.json
          grep -F '"postgres":true' release-lanes.json
